<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IDENTITAS PRIBADI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
overflow-x:hidden;
}

.background{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#132c63,#050816);
z-index:-1;
}

.header{
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#00e5ff;
text-shadow:0 0 15px #00e5ff;
}

.box{
width:90%;
max-width:500px;
margin:auto;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
border-radius:20px;
padding:25px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px #00e5ff33;
margin-top:20px;
margin-bottom:40px;
}

input{
width:95%;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
background:#0d1228;
color:white;
border:1px solid #00e5ff;
box-sizing:border-box;
}

textarea{
width:95%;
height:100px;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
background:#0d1228;
color:white;
border:1px solid #00e5ff;
resize:none;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00e5ff;
color:black;
font-weight:bold;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

button:hover{
box-shadow:0 0 20px #00e5ff;
}

button:disabled{
opacity:0.6;
cursor:wait;
}

.data-box{
margin-top:30px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
line-height:1.8;
text-align:center;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="header">
IDENTITAS PRIBADI
</div>

<div class="box">

<div id="securityBox">

<input
type="password"
id="securityPassword"
placeholder="Masukkan Password">

<button onclick="cekPassword()">
AKSES IDENTITAS
</button>

</div>


<div id="identitasForm" style="display:none;">

<input type="text" id="nama" placeholder="Nama Lengkap">

<input type="text" id="ttl" placeholder="Tempat, Tanggal Lahir">

<input type="text" id="hobi" placeholder="Hobi">

<input type="text" id="alamat" placeholder="Tempat Tinggal">

<input type="text" id="makanan" placeholder="Makanan Favorit">

<input type="text" id="minuman" placeholder="Minuman Favorit">

<input type="text" id="film" placeholder="Film Favorit">

<input type="text" id="telepon" placeholder="Nomor Telepon">

<input type="text" id="instagram" placeholder="Instagram">

<input type="text" id="tiktok" placeholder="TikTok">

<input type="text" id="x" placeholder="X / Twitter">

<input type="text" id="google" placeholder="Google / Email">

<textarea
id="catatan"
placeholder="Catatan Tambahan"></textarea>

<button id="simpanBtn" onclick="simpanData()">
SIMPAN IDENTITAS
</button>


<div class="data-box" id="hasilData">

DATA BELUM DISIMPAN

</div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

apiKey: "AIzaSyDNFcrqvtonunXvodvTYkbgSPnFatxN9FY",

authDomain: "nasya-security-system.firebaseapp.com",

projectId: "nasya-security-system",

storageBucket: "nasya-security-system.firebasestorage.app",

messagingSenderId: "385853954914",

appId: "1:385853954914:web:6b2277430224b6cecb2a3b"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   REFERENSI DOKUMEN
========================= */

const ownerRef = doc(
db,
"identitas",
"Owner"
);


/* =========================
   AKSES IDENTITAS
========================= */

window.cekPassword = async function(){

const password =
document.getElementById("securityPassword").value;

const hasil =
document.getElementById("hasilData");


if(password !== "58@4@"){

document.body.innerHTML = `

<div style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:red;
font-family:Arial;
color:white;
text-align:center;
">

<h1 style="font-size:70px;margin:0;">
ERROR‼️
</h1>

<p style="font-size:22px;">
Cosa stai cercando?
</p>

</div>

`;

return;

}


/* =========================
   BUKA FORM
========================= */

document.getElementById("securityBox")
.style.display = "none";

document.getElementById("identitasForm")
.style.display = "block";


/* =========================
   AMBIL DATA DARI FIREBASE
========================= */

hasil.innerHTML =
"🔄 <b>MEMUAT DATA...</b>";


try{

const docSnap =
await getDoc(ownerRef);


if(docSnap.exists()){

const data =
docSnap.data();


/* ISI FORM OTOMATIS */

document.getElementById("nama").value =
data.nama || "";

document.getElementById("ttl").value =
data.ttl || "";

document.getElementById("hobi").value =
data.hobi || "";

document.getElementById("alamat").value =
data.alamat || "";

document.getElementById("makanan").value =
data.makanan || "";

document.getElementById("minuman").value =
data.minuman || "";

document.getElementById("film").value =
data.film || "";

document.getElementById("telepon").value =
data.telepon || "";

document.getElementById("instagram").value =
data.instagram || "";

document.getElementById("tiktok").value =
data.tiktok || "";

document.getElementById("x").value =
data.x || "";

document.getElementById("google").value =
data.google || "";

document.getElementById("catatan").value =
data.catatan || "";


/* STATUS */

hasil.innerHTML =
"✅ <b>DATA TERSIMPAN</b>";

}else{

hasil.innerHTML =
"⚠️ <b>DATA BELUM DISIMPAN</b>";

}

}catch(error){

console.error(error);

hasil.innerHTML =
"❌ <b>GAGAL MEMUAT DATA</b>";

}

};


/* =========================
   SIMPAN DATA
========================= */

window.simpanData = async function(){

const tombol =
document.getElementById("simpanBtn");

const hasil =
document.getElementById("hasilData");


/* AMBIL DATA */

const nama =
document.getElementById("nama").value;

const ttl =
document.getElementById("ttl").value;

const hobi =
document.getElementById("hobi").value;

const alamat =
document.getElementById("alamat").value;

const makanan =
document.getElementById("makanan").value;

const minuman =
document.getElementById("minuman").value;

const film =
document.getElementById("film").value;

const telepon =
document.getElementById("telepon").value;

const instagram =
document.getElementById("instagram").value;

const tiktok =
document.getElementById("tiktok").value;

const x =
document.getElementById("x").value;

const google =
document.getElementById("google").value;

const catatan =
document.getElementById("catatan").value;


/* STATUS */

hasil.innerHTML =
"🔄 <b>MENYIMPAN DATA...</b>";

tombol.disabled = true;


try{


/* =========================
   SIMPAN KE FIREBASE
========================= */

await setDoc(

ownerRef,

{

nama,
ttl,
hobi,
alamat,
makanan,
minuman,
film,
telepon,
instagram,
tiktok,
x,
google,
catatan

},

{

merge:true

}

);


/* =========================
   BERHASIL
========================= */

hasil.innerHTML = `
✅ <b>DATA TERSIMPAN</b>
<br>
<small>Data berhasil disimpan secara permanen.</small>
`;


}catch(error){

console.error(error);


/* =========================
   GAGAL
========================= */

hasil.innerHTML = `
❌ <b>DATA GAGAL DISIMPAN</b>
<br>
<small>Periksa koneksi atau Firebase.</small>
`;

}


tombol.disabled = false;

};

</script>

</body>
</html>
