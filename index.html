<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Nasya Portal</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
    }

    .box {
      text-align: center;
      color: white;
    }

    input {
      padding: 10px;
      width: 200px;
      border: none;
      outline: none;
      margin-top: 10px;
      text-align: center;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>NASYA PORTAL</h2>
    <p>Masukkan username</p>

    <input id="username" placeholder="username...">
    <br>
    <button onclick="login()">ENTER</button>
  </div>

  <script>
    function login() {
      let user = document.getElementById("username").value;

      if (user.trim() === "") {
        alert("Username tidak boleh kosong");
      } else {
        localStorage.setItem("username", user);
        window.location.href = "home.html";
      }
    }
  </script>

</body>
</html>
