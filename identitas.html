<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IDENTITAS PRIBADI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
overflow-x:hidden;
}

.background{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#132c63,#050816);
z-index:-1;
}

.header{
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#00e5ff;
text-shadow:0 0 15px #00e5ff;
}

.box{
width:90%;
max-width:500px;
margin:auto;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
border-radius:20px;
padding:25px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px #00e5ff33;
margin-top:20px;
margin-bottom:40px;
}

input{
width:95%;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
background:#0d1228;
color:white;
border:1px solid #00e5ff;
}

textarea{
width:95%;
height:100px;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
background:#0d1228;
color:white;
border:1px solid #00e5ff;
resize:none;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00e5ff;
color:black;
font-weight:bold;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

button:hover{
box-shadow:0 0 20px #00e5ff;
}

.data-box{
margin-top:30px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
line-height:1.8;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="header">
IDENTITAS PRIBADI
</div>

<div class="box">

<input type="text" id="nama" placeholder="Nama Lengkap">

<input type="text" id="ttl" placeholder="Tempat, Tanggal Lahir">

<input type="text" id="hobi" placeholder="Hobi">

<input type="text" id="alamat" placeholder="Tempat Tinggal">

<input type="text" id="makanan" placeholder="Makanan Favorit">

<input type="text" id="minuman" placeholder="Minuman Favorit">

<input type="text" id="film" placeholder="Film Favorit">

<input type="text" id="telepon" placeholder="Nomor Telepon">

<input type="text" id="instagram" placeholder="Instagram">

<input type="text" id="tiktok" placeholder="TikTok">

<input type="text" id="x" placeholder="X / Twitter">

<input type="text" id="google" placeholder="Google / Email">

<textarea id="catatan"
placeholder="Catatan Tambahan"></textarea>

<button onclick="simpanData()">
SIMPAN IDENTITAS
</button>

<div class="data-box" id="hasilData">

DATA BELUM DISIMPAN

</div>

</div>

<script>

function simpanData(){

const nama =
document.getElementById("nama").value;

const ttl =
document.getElementById("ttl").value;

const hobi =
document.getElementById("hobi").value;

const alamat =
document.getElementById("alamat").value;

const makanan =
document.getElementById("makanan").value;

const minuman =
document.getElementById("minuman").value;

const film =
document.getElementById("film").value;

const telepon =
document.getElementById("telepon").value;

const instagram =
document.getElementById("instagram").value;

const tiktok =
document.getElementById("tiktok").value;

const x =
document.getElementById("x").value;

const google =
document.getElementById("google").value;

const catatan =
document.getElementById("catatan").value;

localStorage.setItem("nama", nama);
localStorage.setItem("ttl", ttl);
localStorage.setItem("hobi", hobi);
localStorage.setItem("alamat", alamat);
localStorage.setItem("makanan", makanan);
localStorage.setItem("minuman", minuman);
localStorage.setItem("film", film);
localStorage.setItem("telepon", telepon);
localStorage.setItem("instagram", instagram);
localStorage.setItem("tiktok", tiktok);
localStorage.setItem("x", x);
localStorage.setItem("google", google);
localStorage.setItem("catatan", catatan);

document.getElementById("hasilData")
.innerHTML = `

<b>Nama:</b> ${nama}<br>
<b>TTL:</b> ${ttl}<br>
<b>Hobi:</b> ${hobi}<br>
<b>Alamat:</b> ${alamat}<br>
<b>Makanan Favorit:</b> ${makanan}<br>
<b>Minuman Favorit:</b> ${minuman}<br>
<b>Film:</b> ${film}<br>
<b>Telepon:</b> ${telepon}<br>
<b>Instagram:</b> ${instagram}<br>
<b>TikTok:</b> ${tiktok}<br>
<b>X:</b> ${x}<br>
<b>Google:</b> ${google}<br>
<b>Catatan:</b> ${catatan}

`;

}

</script>

</body>
  </html>
