<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BERKAS PRIBADI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
overflow-x:hidden;
}

.background{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#132c63,#050816);
z-index:-1;
}

.header{
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#00e5ff;
text-shadow:0 0 15px #00e5ff;
}

.box{
width:90%;
max-width:700px;
margin:auto;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
border-radius:20px;
padding:25px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px #00e5ff33;
margin-top:20px;
margin-bottom:40px;
}

input{
width:95%;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
background:#0d1228;
color:white;
border:1px solid #00e5ff;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00e5ff;
color:black;
font-weight:bold;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

button:hover{
box-shadow:0 0 20px #00e5ff;
}

.file-box{
margin-top:20px;
padding:15px;
border-radius:15px;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
}

img{
width:100%;
border-radius:12px;
margin-top:10px;
}

video{
width:100%;
border-radius:12px;
margin-top:10px;
}

a{
color:#8befff;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="header">
BERKAS PRIBADI
</div>

<div class="box">

<div id="securityBox">

<input type="password"
id="securityPassword"
placeholder="Masukkan Password">

<button onclick="cekPassword()">
AKSES BERKAS
</button>

</div>

<div id="berkasForm"
style="display:none;">

<input type="file"
id="fileInput">

<button onclick="uploadFile()">
UPLOAD BERKAS
</button>

<div id="hasilFile"></div>

</div>

</div>

<script>

window.onload = function(){

const saved =
localStorage.getItem("berkasHTML");

if(saved){

document.getElementById("hasilFile")
.innerHTML = saved;

}

}

function cekPassword(){

const password =
document.getElementById("securityPassword").value;

if(password === "58@4@"){

document.getElementById("securityBox")
.style.display = "none";

document.getElementById("berkasForm")
.style.display = "block";

}else{

document.body.innerHTML = `

<div style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:red;
font-family:Arial;
animation:blink 0.3s infinite;
color:white;
">

<h1 style="
font-size:70px;
margin:0;
">
ERROR‼️
</h1>

<p style="
font-size:22px;
margin-top:15px;
">
Cosa stai cercando?
</p>

</div>

<style>

@keyframes blink{

0%{
background:#ff0000;
}

50%{
background:#4d0000;
}

100%{
background:#ff0000;
}

}

</style>

`;

}

}

function uploadFile(){

const file =
document.getElementById("fileInput")
.files[0];

if(!file){

alert("Pilih file dulu");

return;

}

const reader =
new FileReader();

reader.onload = function(e){

let fileHTML = "";

if(file.type.startsWith("image")){

fileHTML = `

<div class="file-box">

📷 ${file.name}

<img src="${e.target.result}">

</div>

`;

}else if(file.type.startsWith("video")){

fileHTML = `

<div class="file-box">

🎥 ${file.name}

<video controls>
<source src="${e.target.result}">
</video>

</div>

`;

}else{

fileHTML = `

<div class="file-box">

📄 ${file.name}

<br><br>

<a href="${e.target.result}"
download>

Download File

</a>

</div>

`;

}

document.getElementById("hasilFile")
.innerHTML += fileHTML;

localStorage.setItem(
"berkasHTML",
document.getElementById("hasilFile")
.innerHTML
);

}

reader.readAsDataURL(file);

}

</script>

</body>
</html>
