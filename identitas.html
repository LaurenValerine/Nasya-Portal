<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IDENTITAS PRIBADI</title>

<style>

body{
margin:0;
font-family:Arial;
background:#050816;
color:white;
overflow-x:hidden;
}

.background{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#132c63,#050816);
z-index:-1;
}

.header{
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#00e5ff;
text-shadow:0 0 15px #00e5ff;
}

.box{
width:90%;
max-width:500px;
margin:auto;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
border-radius:20px;
padding:25px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px #00e5ff33;
margin-top:20px;
margin-bottom:40px;
box-sizing:border-box;
}

input{
width:100%;
box-sizing:border-box;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
background:#0d1228;
color:white;
border:1px solid #00e5ff;
font-size:16px;
}

textarea{
width:100%;
box-sizing:border-box;
height:100px;
padding:12px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
background:#0d1228;
color:white;
border:1px solid #00e5ff;
resize:none;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00e5ff;
color:black;
font-weight:bold;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

button:hover{
box-shadow:0 0 20px #00e5ff;
}

button:disabled{
opacity:0.6;
cursor:not-allowed;
}

.data-box{
margin-top:30px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.05);
border:1px solid #00e5ff;
line-height:1.8;
text-align:center;
font-size:16px;
}

.success{
color:#00ff9d;
}

.error{
color:#ff6b6b;
}

.loading{
color:#00e5ff;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="header">
IDENTITAS PRIBADI
</div>

<div class="box">

<!-- PASSWORD -->

<div id="securityBox">

<input
type="password"
id="securityPassword"
placeholder="Masukkan Password">

<button onclick="cekPassword()">
AKSES IDENTITAS
</button>

</div>


<!-- FORM IDENTITAS -->

<div id="identitasForm" style="display:none;">

<input type="text" id="nama" placeholder="Nama Lengkap">

<input type="text" id="ttl" placeholder="Tempat, Tanggal Lahir">

<input type="text" id="hobi" placeholder="Hobi">

<input type="text" id="alamat" placeholder="Tempat Tinggal">

<input type="text" id="makanan" placeholder="Makanan Favorit">

<input type="text" id="minuman" placeholder="Minuman Favorit">

<input type="text" id="film" placeholder="Film Favorit">

<input type="text" id="telepon" placeholder="Nomor Telepon">

<input type="text" id="instagram" placeholder="Instagram">

<input type="text" id="tiktok" placeholder="TikTok">

<input type="text" id="x" placeholder="X / Twitter">

<input type="text" id="google" placeholder="Google / Email">

<textarea
id="catatan"
placeholder="Catatan Tambahan"></textarea>

<button id="saveButton" onclick="simpanData()">
SIMPAN IDENTITAS
</button>


<!-- STATUS -->

<div class="data-box" id="hasilData">

DATA BELUM DIMUAT

</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "AIzaSyDNFcrqvtonunXvodvTYkbgSPnFatxN9FY",

authDomain:
"nasya-security-system.firebaseapp.com",

projectId:
"nasya-security-system",

storageBucket:
"nasya-security-system.firebasestorage.app",

messagingSenderId:
"385853954914",

appId:
"1:385853954914:web:6b2277430224b6cecb2a3b"

};


/* =========================
   FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   REFERENSI DOKUMEN
========================= */

const dataRef =
doc(db,"identitas","owner");


/* =========================
   CEK PASSWORD
========================= */

window.cekPassword = async function(){

const password =
document.getElementById(
"securityPassword"
).value;


if(password === "58@4@"){

document.getElementById(
"securityBox"
).style.display = "none";


document.getElementById(
"identitasForm"
).style.display = "block";


await muatData();


}else{

document.body.innerHTML = `

<div style="
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:red;
font-family:Arial;
color:white;
text-align:center;
">

<h1 style="
font-size:70px;
margin:0;
">
ERROR‼️
</h1>

<p style="
font-size:22px;
margin-top:15px;
">
Cosa stai cercando?
</p>

</div>

`;

}

};


/* =========================
   MUAT DATA FIREBASE
========================= */

async function muatData(){

const status =
document.getElementById(
"hasilData"
);

status.className =
"data-box loading";

status.innerHTML =
"⏳ MEMERIKSA DATA...";


try{

const docSnap =
await getDoc(dataRef);


if(docSnap.exists()){

const data =
docSnap.data();


document.getElementById("nama").value =
data.nama || "";

document.getElementById("ttl").value =
data.ttl || "";

document.getElementById("hobi").value =
data.hobi || "";

document.getElementById("alamat").value =
data.alamat || "";

document.getElementById("makanan").value =
data.makanan || "";

document.getElementById("minuman").value =
data.minuman || "";

document.getElementById("film").value =
data.film || "";

document.getElementById("telepon").value =
data.telepon || "";

document.getElementById("instagram").value =
data.instagram || "";

document.getElementById("tiktok").value =
data.tiktok || "";

document.getElementById("x").value =
data.x || "";

document.getElementById("google").value =
data.google || "";

document.getElementById("catatan").value =
data.catatan || "";


status.className =
"data-box success";

status.innerHTML =
"✅ DATA TERSIMPAN<br><small>Data berhasil dimuat dari Firebase.</small>";


}else{

status.className =
"data-box";

status.innerHTML =
"📂 BELUM ADA DATA<br><small>Silakan isi identitas lalu simpan.</small>";

}

}catch(error){

console.error(error);

status.className =
"data-box error";

status.innerHTML =
"❌ DATA GAGAL DIMUAT<br><small>Periksa koneksi atau Firebase Rules.</small>";

}

}


/* =========================
   SIMPAN DATA
========================= */

window.simpanData = async function(){

const button =
document.getElementById(
"saveButton"
);

const status =
document.getElementById(
"hasilData"
);


button.disabled = true;

button.innerText =
"MENYIMPAN...";


status.className =
"data-box loading";

status.innerHTML =
"⏳ MENYIMPAN DATA KE FIREBASE...";


/* AMBIL DATA */

const data = {

nama:
document.getElementById("nama").value,

ttl:
document.getElementById("ttl").value,

hobi:
document.getElementById("hobi").value,

alamat:
document.getElementById("alamat").value,

makanan:
document.getElementById("makanan").value,

minuman:
document.getElementById("minuman").value,

film:
document.getElementById("film").value,

telepon:
document.getElementById("telepon").value,

instagram:
document.getElementById("instagram").value,

tiktok:
document.getElementById("tiktok").value,

x:
document.getElementById("x").value,

google:
document.getElementById("google").value,

catatan:
document.getElementById("catatan").value

};


try{

/*
MERGE TRUE
agar data lama tidak
dihapus secara tidak sengaja
*/

await setDoc(
dataRef,
data,
{
merge:true
}
);


/* BERHASIL */

status.className =
"data-box success";

status.innerHTML = `
✅ DATA TERSIMPAN

<br>

<small>
Identitas berhasil disimpan secara permanen di Firebase.
</small>
`;


button.innerText =
"DATA TERSIMPAN ✓";


setTimeout(() => {

button.innerText =
"SIMPAN IDENTITAS";

button.disabled = false;

},2000);


}catch(error){

console.error(
"Firebase Error:",
error
);


status.className =
"data-box error";

status.innerHTML = `
❌ DATA GAGAL DISIMPAN

<br>

<small>
${error.message}
</small>
`;


button.innerText =
"COBA SIMPAN LAGI";

button.disabled = false;

}

};

</script>

</body>
</html>
